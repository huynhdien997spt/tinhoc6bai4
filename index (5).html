/* ================= TRẠNG THÁI + LOCALSTORAGE ================= */
let S = null, view = 0, ROSTER = [], saveT = 0;
function blank(st) {
  return {studentId: st.id, name: st.name, cls: st.cls, studentKey: keyOf(st.id), page: 1, maxPage: 1, answers: {}, completedActivities: [],
    score: 0, xp: 0, startTime: Date.now(), mindmap: {a:["","",""], b:["","",""], c:["","",""], d:["","",""]}, exitTicket: {diff: []}, syncQueue: [], acts: {}, done: false, fast: false, fastAck: false, duration: 0};
}
function A(id) { if (!S.acts[id]) S.acts[id] = {t0: Date.now(), st: {}}; return S.acts[id]; }
function recalc() {
  let sc = 0, xp = 0; S.completedActivities = []; S.answers = {};
  for (const id of ALL) { const a = S.acts[id]; if (a && a.done) { sc += +a.score || 0; xp += +a.xp || 0; S.completedActivities.push(id); S.answers[id] = a.answer; } }
  S.score = Math.round(sc * 10) / 10; S.xp = Math.round(xp);
}
function save() { if (!S) return; lsSet("b11:" + S.studentKey, S); lsSet("b11:last", S.studentKey); }
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 400); }

/* ================= ĐỒNG BỘ + HÀNG ĐỢI OFFLINE ================= */
async function apiGet(params) {
  const r = await fetch(CONFIG.googleScriptUrl.trim() + "?" + new URLSearchParams(params), {redirect: "follow"});
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(CONFIG.googleScriptUrl.trim(), {method: "POST", redirect: "follow", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(body)});
  return r.json();
}
function enqueue(p) {
  Object.assign(p, {lessonId: CONFIG.lessonId, schoolYear: CONFIG.schoolYear, studentKey: S.studentKey, studentId: S.studentId, name: S.name, cls: S.cls,
    progress: S.maxPage, totalScore: S.score, totalXp: S.xp, clientTime: new Date().toISOString()});
  S.syncQueue.push(p); save(); flush();
}
let flushing = false;
async function flush() {
  if (!S) return setSync();
  if (DEMO) { if (S.syncQueue.length) { S.syncQueue = []; save(); } return setSync(); }
  if (flushing || !S.syncQueue.length) return setSync();
  flushing = true;
  try {
    while (S.syncQueue.length) {
      const item = S.syncQueue[0], j = await apiPost(item);
      if (j && j.ok) S.syncQueue.shift();
      else { item._tries = (item._tries || 0) + 1; if (item._tries >= 3) { console.warn("Bỏ qua yêu cầu bị máy chủ từ chối", item, j); S.syncQueue.shift(); } else { save(); break; } }
      save();
    }
  } catch (e) { /* mất mạng: giữ nguyên hàng đợi */ }
  flushing = false; setSync();
}
function setSync() {
  const el = $("#sync"), n = S ? S.syncQueue.length : 0;
  el.className = "pill" + (DEMO ? " demo" : n ? " wait" : "");
  el.textContent = DEMO ? "🟡 DEMO MODE" : n ? `☁ Đang chờ đồng bộ (${n})` : "✅ Đã đồng bộ";
}
window.addEventListener("online", flush);
setInterval(flush, 20000);

/* ================= KHUNG HOẠT ĐỘNG ================= */
function finish(id, r) {
  const a = A(id); if (a.done) return;
  a.done = true; a.answer = r.answer; a.correct = !!r.correct; a.attempts = r.attempts || 1; a.score = r.score;
  a.xp = Math.round(r.score) + 5; a.time = Math.round((Date.now() - a.t0) / 1000);
  recalc(); save();
  enqueue({action: "submit", activityId: id, answer: JSON.stringify(r.answer).slice(0, 4000), correct: a.correct, attempts: a.attempts, score: a.score, xp: a.xp, timeSpent: a.time});
  toast(`+${a.xp} XP`); chrome();
}
function ladder(st, h, k, answerHTML) {
  st.w = (st.w || 0) + 1;
  if (st.w >= 3) return {c: "rev", h: `✅ <b>Đáp án:</b> ${answerHTML}`};
  if (st.w === 2) return {c: "key", h: `🔍 <b>Từ khóa cần nhớ:</b> ${k || "đọc lại phần giải thích ở hoạt động trước."}`, retry: 1};
  return {c: "hint", h: `💡 <b>Gợi ý:</b> ${h || "Hãy nghĩ về hậu quả đối với người khác và việc có được phép hay không."}`, retry: 1};
}
const fbHTML = (id, f) => !f ? "" : `<div class="fb ${f.c}" role="status">${f.h}${f.retry ? `<br><button class="btn sm ghost" data-act="${id}" data-do="retry">THỬ LẠI</button>` : ""}</div>`;
function actHTML(id) {
  const q = ACT[id], a = A(id);
  let body;
  if (a.done && a.restored) body = `<p class="hint0">Đã khôi phục kết quả từ máy chủ. Điểm: <b>${a.score}/10</b>.</p>`;
  else body = (q.ask ? `<p class="ask">${q.ask}</p>` : "") + R[q.type](id, q, a);
  return `<div class="acth"><span class="tag">${q.tag || "Hoạt động"}</span><h3>${q.title}</h3>${a.done ? `<span class="tag ok">✔ ${a.score}/10 điểm</span>` : ""}</div>${body}`;
}
function renderAct(id) { const el = document.getElementById("act-" + id); if (el) { el.className = "card act" + (A(id).done ? " done" : ""); el.innerHTML = actHTML(id); } }
const R = {}, H = {};

/* ----- sort: chọn thẻ → chọn nhóm ----- */
R.sort = (id, q, a) => {
  const st = a.st; st.d = st.d || {};
  const left = q.cards.map((c, i) => i).filter(i => !(st.d[i] && st.d[i].ok));
  let h = left.length ? `<p class="hint0">① Chọn một thẻ → ② Chọn nhóm. Còn ${left.length}/${q.cards.length} thẻ.</p><div class="chips">` +
    left.map(i => `<button class="chip ${st.sel === i ? "on" : ""}" aria-pressed="${st.sel === i}" data-act="${id}" data-do="pick" data-v="${i}">${q.cards[i].t}</button>`).join("") + `</div>` : "";
  h += `<div class="groups">` + q.groups.map((g, gi) => `<div class="grp"><button class="grpbtn" ${left.length ? "" : "disabled"} data-act="${id}" data-do="put" data-v="${gi}">${g}</button><div class="placed">` +
    q.cards.map((c, i) => st.d[i] && st.d[i].ok && st.d[i].g === gi ? `<span>${st.d[i].w >= 3 ? "👁" : "✔"} ${c.t}</span>` : "").join("") + `</div></div>`).join("") + `</div>`;
  return h + fbHTML(id, st.fb);
};
H.sort = (id, q, d, v) => {
  const a = A(id), st = a.st; v = +v;
  if (d === "pick") { st.sel = v; st.fb = null; }
  else if (d === "retry") st.fb = null;
  else if (d === "put") {
    if (st.sel == null || (st.d[st.sel] && st.d[st.sel].ok)) { st.fb = {c: "hint", h: "Hãy chọn một thẻ trước."}; return; }
    const i = st.sel, c = q.cards[i], rec = st.d[i] = st.d[i] || {w: 0};
    const tail = c.e + (c.law ? LAWMSG : "");
    if (c.a.includes(v)) { rec.ok = true; rec.g = v; st.sel = null; st.fb = {c: "ok", h: `✅ <b>${c.t}</b> → ${q.groups[v]}<br>${tail}`}; }
    else {
      const f = ladder(rec, c.h || q.h, c.k, `<b>${c.t}</b> → ${q.groups[c.a[0]]}<br>${tail}`);
      if (rec.w >= 3) { rec.ok = true; rec.g = c.a[0]; st.sel = null; }
      st.fb = f;
    }
    if (q.cards.every((c, i) => st.d[i] && st.d[i].ok)) {
      const ws = q.cards.map((c, i) => st.d[i].w);
      finish(id, {answer: q.cards.map((c, i) => ({card: c.t, group: q.groups[st.d[i].g], wrong: st.d[i].w})), correct: ws.every(w => !w),
        attempts: ws.reduce((s, w) => s + w, 0) + 1, score: Math.round(ws.reduce((s, w) => s + PT[Math.min(w, 3)], 0) / ws.length * 10) / 10});
    }
  }
};
/* ----- choice: một lựa chọn (+ giải thích) ----- */
R.choice = (id, q, a) => {
  const st = a.st, x = st.x || [];
  let h = `<div class="opts">` + q.o.map((o, i) => `<button class="chip ${st.ok && i === q.a ? "good" : x.includes(i) ? "bad" : ""}" ${st.ok || x.includes(i) ? "disabled" : ""} data-act="${id}" data-do="opt" data-v="${i}">${o}</button>`).join("") + `</div>` + fbHTML(id, st.fb);
  if (q.explain && st.ok) h += a.done ? `<p class="hint0">Giải thích của em: ${esc(st.why)}</p>` :
    `<label for="why-${id}" style="display:block;margin-top:12px">Giải thích bằng một câu: vì sao cần ghi như vậy?</label><textarea id="why-${id}" data-act="${id}" data-k="why">${esc(st.why || "")}</textarea><button class="btn sm" style="margin-top:8px" data-act="${id}" data-do="explain">GỬI GIẢI THÍCH</button>${st.err ? `<div class="fb warn">${st.err}</div>` : ""}`;
  return h;
};
H.choice = (id, q, d, v) => {
  const a = A(id), st = a.st;
  const fin = () => finish(id, {answer: {first: q.o[st.first], final: q.o[q.a], why: st.why || ""}, correct: !st.w, attempts: (st.w || 0) + 1, score: PT[Math.min(st.w || 0, 3)]});
  if (d === "retry") st.fb = null;
  else if (d === "opt" && !st.ok) {
    v = +v; if (st.first == null) st.first = v;
    if (v === q.a) { st.ok = true; st.fb = {c: "ok", h: "✅ <b>Chính xác.</b> " + q.e}; if (!q.explain) fin(); }
    else { st.x = (st.x || []).concat(v); st.fb = ladder(st, q.h, q.k, `<b>${q.o[q.a]}</b><br>${q.e}`); if (st.w >= 3) { st.ok = true; if (!q.explain) fin(); } }
  } else if (d === "explain") {
    if ((st.why || "").trim().length < 10) st.err = "Hãy viết ít nhất một câu giải thích (từ 10 kí tự).";
    else { st.err = ""; fin(); }
  }
};
/* ----- multi: chọn nhiều ----- */
R.multi = (id, q, a) => {
  const st = a.st, sel = st.sel || [];
  return `<div class="opts">` + q.o.map((o, i) => `<button class="chip ${st.ok ? (q.a.includes(i) ? "good" : "") : sel.includes(i) ? "on" : ""}" aria-pressed="${sel.includes(i)}" ${st.ok ? "disabled" : ""} data-act="${id}" data-do="tog" data-v="${i}">${st.ok ? "" : sel.includes(i) ? "☑ " : "☐ "}${o}</button>`).join("") + `</div>` +
    (st.ok ? "" : `<button class="btn sm" style="margin-top:10px" data-act="${id}" data-do="check">KIỂM TRA</button>`) + fbHTML(id, st.fb);
};
H.multi = (id, q, d, v) => {
  const a = A(id), st = a.st; st.sel = st.sel || [];
  if (d === "tog" && !st.ok) { v = +v; st.sel = st.sel.includes(v) ? st.sel.filter(x => x !== v) : st.sel.concat(v); st.fb = null; }
  else if (d === "retry") st.fb = null;
  else if (d === "check" && !st.ok) {
    if (!st.sel.length) { st.fb = {c: "hint", h: "Hãy chọn ít nhất một mục."}; return; }
    if (st.first == null) st.first = st.sel.slice();
    const good = st.sel.length === q.a.length && q.a.every(x => st.sel.includes(x));
    if (good) { st.ok = true; st.fb = {c: "ok", h: "✅ <b>Chính xác.</b> " + q.e}; }
    else { st.fb = ladder(st, q.h, q.k, q.e); if (st.w >= 3) st.ok = true; }
    if (st.ok) finish(id, {answer: {first: st.first.map(i => q.o[i])}, correct: !st.w, attempts: (st.w || 0) + 1, score: PT[Math.min(st.w || 0, 3)]});
  }
};
/* ----- order: sắp thứ tự ----- */
R.order = (id, q, a) => {
  const st = a.st, seq = st.seq || [];
  if (st.ok) return `<div class="flow good">` + q.items.map((t, i) => `<div>${i + 1}. ${t}</div>`).join("<i>↓</i>") + `</div>` + fbHTML(id, st.fb);
  return `<div class="chips">` + q.show.map(i => `<button class="chip ${seq.includes(i) ? "on" : ""}" ${seq.includes(i) ? "disabled" : ""} data-act="${id}" data-do="add" data-v="${i}">${seq.includes(i) ? `<b>${seq.indexOf(i) + 1}.</b> ` : ""}${q.items[i]}</button>`).join("") +
    `</div><button class="btn sm ghost" data-act="${id}" data-do="retry">XẾP LẠI</button>` + fbHTML(id, st.fb && !st.fb.retry ? st.fb : st.fb ? {c: st.fb.c, h: st.fb.h} : null);
};
H.order = (id, q, d, v) => {
  const a = A(id), st = a.st; st.seq = st.seq || [];
  if (d === "retry") { st.seq = []; st.fb = null; }
  else if (d === "add" && !st.ok) {
    if (st.seq.length === 0) st.fb = null;
    st.seq.push(+v);
    if (st.seq.length === q.items.length) {
      if (!st.first) st.first = st.seq.slice();
      if (st.seq.every((x, i) => x === i)) { st.ok = true; st.fb = {c: "ok", h: "✅ <b>Chính xác.</b> " + q.e}; }
      else { st.fb = ladder(st, q.h, q.k, q.e); st.seq = []; if (st.w >= 3) st.ok = true; }
      if (st.ok) finish(id, {answer: {first: st.first.map(i => q.items[i])}, correct: !st.w, attempts: (st.w || 0) + 1, score: PT[Math.min(st.w || 0, 3)]});
    }
  }
};
/* ----- reflect: suy nghĩ trước, chốt sau ----- */
R.reflect = (id, q, a) => {

function mmSVG(mm) {
  mm = mm || {};
  let s = `<svg class="mm" viewBox="0 0 700 360" role="img" aria-label="Sơ đồ tư duy tổng kết"><g font-family="system-ui,sans-serif">`;
  for (const [k, t, c, x, y] of MMB) {
    s += `<path d="M350 180 Q ${(350 + x) / 2} ${y} ${x} ${y}" stroke="${c}" stroke-width="3" fill="none"/>`;
    (mm[k] || []).filter(w => w && String(w).trim()).slice(0, 3).forEach((w, i) => {
      const yy = y < 180 ? y + 40 + i * 24 : y - 40 - i * 24;
      s += `<rect x="${x - 110}" y="${yy - 14}" width="220" height="21" rx="6" fill="#fff" stroke="${c}"/><text x="${x}" y="${yy + 1}" text-anchor="middle" font-size="12.5" fill="#16223a">${esc(String(w).trim().slice(0, 30))}</text>`;
    });
    s += `<rect x="${x - 125}" y="${y - 18}" width="250" height="36" rx="18" fill="${c}"/><text x="${x}" y="${y + 5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">${t}</text>`;
  }
  return s + `<rect x="215" y="155" width="270" height="50" rx="14" fill="#0f1f3d"/><text x="350" y="186" text-anchor="middle" fill="#fff" font-size="14.5" font-weight="800">ỨNG XỬ TRONG MÔI TRƯỜNG SỐ</text></g></svg>`;
}

function submitExit() {

  if (!(e.diff || []).length) err.push("Câu 2: chọn ít nhất một mục.");
  if ((e.app || "").trim().length < 15) err.push("Câu 3: hãy nêu ba việc em sẽ làm.");

function demoData() {

  const roster = DEMO_ROSTER.map(r => ({StudentID: r.id, "Họ tên": r.name, "Lớp": r.cls})), students = [], responses = [], exits = [];
  const kws = {a: ["mức độ", "hậu quả", "tôn trọng"], b: ["kiểm chứng", "chia sẻ = phát tán", "4 câu hỏi"], c: ["licence", "nhân thân", "tài sản"], d: ["minh bạch", "AI có thể sai", "xác minh"]};
  DEMO_ROSTER.slice(0, 6).forEach((r, i) => {
    if (S && r.id === S.studentId) return;
    const done = i < 4, n = done ? ALL.length : 5 + i * 2, sk = keyOf(r.id); let sc = 0, xp = 0;
    ALL.slice(0, n).forEach(id => { const w = rnd() < (/LICENSE|COPYRIGHT|CASE_CLASSIFY|Q6/.test(id) ? .6 : .25) ? 1 + Math.floor(rnd() * 2) : 0, score = PT[w]; sc += score; xp += score + 5;

      responses.push({StudentKey: sk, StudentID: r.id, ActivityID: id, Answer: ans, Correct: !w, Attempts: w + 1, Score: score, XP: score + 5, TimeSpent: 60 + Math.floor(rnd() * 200)}); });
    const dur = i === 3 ? 420 : 3600 + Math.floor(rnd() * 1500);
    students.push({StudentKey: sk, StudentID: r.id, "Họ tên": r.name, "Lớp": r.cls, "Hoàn thành": done, "Tiến độ": done ? 5 : 2 + (i % 3), "Tổng điểm": sc, XP: xp, DurationSeconds: done ? dur : "", FastFinish: done && dur < 600});
    if (done) exits.push({StudentKey: sk, StudentID: r.id, "Họ tên": r.name, "Lớp": r.cls, Learned: "Chia sẻ cũng là phát tán.", DifficultPart: [pick(DIFFS), pick(DIFFS)].filter((x, j, a) => a.indexOf(x) === j).join("; "),

    if (S.done) exits.push({StudentKey: S.studentKey, StudentID: S.studentId, "Họ tên": S.name, "Lớp": S.cls, Learned: S.exitTicket.learned, DifficultPart: S.exitTicket.diff.join("; "), Application: S.exitTicket.app, Understanding: S.exitTicket.und, Question: S.exitTicket.q, MindmapJSON: JSON.stringify(S.mindmap)});

  // Nội dung khó + mức hiểu

  const und = [0, 0, 0, 0, 0]; exits.forEach(e => { const u = +e.Understanding; if (u >= 1 && u <= 5) und[u - 1]++; });
  const bar = (n, tot) => `<div class="meter"><i style="width:${tot ? Math.round(n / tot * 100) : 0}%"></i></div>`;

  const ai = {n: 0, wrong: 0, src: 0, priv: 0, cross: 0};
  responses.filter(r => r.ActivityID === "B11_AI_VERIFY").forEach(r => { let a = {}; try { a = JSON.parse(r.Answer); } catch (e) {} ai.n++; if (a.aiCanBeWrong) ai.wrong++; if ((a.source || "").trim()) ai.src++; if (a.noPersonal) ai.priv++; if (a.crossChecked) ai.cross++; });
  const integ = responses.filter(r => r.ActivityID === "B11_AI_INTEGRITY" || r.ActivityID === "B11_FINAL_Q8"), integStu = new Set(integ.filter(r => +r.Score >= 7).map(r => r.StudentKey)).size;
  // Chưa hoàn thành
  const byId = {}; students.forEach(s => byId[String(s.StudentID)] = s);
  const notDone = roster.filter(r => !(byId[String(r.StudentID)] && truthy(byId[String(r.StudentID)]["Hoàn thành"])));
  const qs = exits.filter(e => String(e.Question || "").trim());
  modal(`<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">👨‍🏫 Dashboard · ${CONFIG.lessonName}</h2>
   <div class="row"><select id="tcls" aria-label="Lọc theo lớp" style="width:auto"><option value="">Tất cả lớp</option>${classes.map(c => `<option ${c === TCLS ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><button class="btn sm ghost" data-do="close">Đóng</button></div></div>
   ${DEMO ? `<p class="note">DEMO MODE: số liệu mẫu kết hợp dữ liệu trên trình duyệt này. Xác thực demo không phải bảo mật production.</p>` : ""}
   <div class="stats">${stat(students.length + "/" + roster.length, "👥 HS đã vào học")}${stat(done.length, "✅ Hoàn thành")}${stat(students.length - done.length, "⏳ Đang học")}
   ${stat(avg(students, "Tổng điểm").toFixed(1) + "/" + MAXSCORE, "📊 Điểm trung bình")}${stat(fmtT(avg(done, "DurationSeconds")), "🕒 Thời gian TB")}${stat(done.filter(s => truthy(s.FastFinish)).length, "⚡ FastFinish")}${stat(exits.length ? avg(exits, "Understanding").toFixed(1) + "/5" : "–", "🙂 Mức hiểu TB")}</div>
   <h3>Hoạt động sai nhiều nhất</h3><div class="tw"><table><tr><th>Hoạt động</th><th>Số bài</th><th>Điểm TB</th><th>Số lần thử TB</th><th>Đúng ngay lần đầu</th></tr>
   ${hard.map(h => `<tr><td>${ACT[h.id].title}<br><small>${h.id}</small></td><td class="n">${h.n}</td><td class="n">${h.sc.toFixed(1)}/10</td><td class="n">${h.at.toFixed(1)}</td><td class="n">${Math.round(h.ok * 100)}%</td></tr>`).join("") || `<tr><td colspan="5">Chưa có dữ liệu.</td></tr>`}</table></div>
   <div class="two" style="margin-top:14px"><div><h3>Nội dung học sinh thấy khó nhất</h3><table>${Object.entries(dc).sort((a, b) => b[1] - a[1]).map(([d, n]) => `<tr><td>${d}</td><td class="n">${n}</td><td>${bar(n, exits.length)}</td></tr>`).join("")}</table></div>
   <div><h3>Mức Understanding</h3><table>${und.map((n, i) => `<tr><td>${i + 1} ${["😕","😐","🙂","😊","🤩"][i]}</td><td class="n">${n}</td><td>${bar(n, exits.length)}</td></tr>`).join("")}</table></div></div>
   <h3 style="margin-top:14px">🤖 AI LITERACY</h3><div class="stats">${stat(ai.wrong + "/" + ai.n, "HS biết AI có thể sai")}${stat(ai.src + "/" + ai.n, "HS có ghi nguồn kiểm chứng")}${stat(ai.cross + "/" + ai.n, "HS đã đối chiếu SGK/nguồn tin cậy")}${stat(ai.priv + "/" + ai.n, "HS cam kết không nhập thông tin cá nhân")}${stat(integStu + "/" + new Set(integ.map(r => r.StudentKey)).size, "HS hiểu nguyên tắc minh bạch AI")}</div>
   <h3>Câu hỏi học sinh gửi (${qs.length})</h3>${qs.map(e => `<div class="cmt"><b>${esc(e["Họ tên"])} (${esc(e["Lớp"])}):</b> ${esc(e.Question)}</div>`).join("") || `<p class="hint0">Chưa có câu hỏi.</p>`}
   <h3 style="margin-top:14px">Mindmap từng học sinh (${exits.length})</h3>${exits.map(e => { let mm = {}; try { mm = JSON.parse(e.MindmapJSON); } catch (x) {} return `<details><summary>${esc(e["Họ tên"])} · ${esc(e["Lớp"])} · mức hiểu ${esc(e.Understanding)}</summary><p class="hint0">Học được: ${esc(e.Learned)}<br>Vận dụng: ${esc(e.Application)}</p>${mmSVG(mm)}</details>`; }).join("") || `<p class="hint0">Chưa có.</p>`}
   <h3 style="margin-top:14px">Học sinh chưa hoàn thành (${notDone.length})</h3><div class="tw"><table><tr><th>Họ tên</th><th>Lớp</th><th>Trạng thái</th><th>Điểm</th></tr>
   ${notDone.map(r => { const s = byId[String(r.StudentID)]; return `<tr><td>${esc(r["Họ tên"])}</td><td>${esc(r["Lớp"])}</td><td>${s ? "Đang ở trang " + esc(s["Tiến độ"]) : "Chưa bắt đầu"}</td><td class="n">${s ? esc(s["Tổng điểm"]) : "–"}</td></tr>`; }).join("") || `<tr><td colspan="4">Tất cả đã hoàn thành.</td></tr>`}</table></div>`, true);
  $("#tcls").onchange = e => { TCLS = e.target.value; dashboard(); };
}

/* ================= SỰ KIỆN ================= */
const G = {
  go: v => { if (S && (+v <= S.maxPage || PAGES[+v - 1].acts.every(id => S.acts[id] && S.acts[id].done))) go(v); },
  start: startStudent,
  reloadRoster: loadRoster,
  swap: () => { if (confirm("Đổi sang học sinh khác? Tiến độ của bạn hiện tại vẫn được lưu trên máy này.")) { save(); S = null; localStorage.removeItem("b11:last"); view = 0; render(); } },
  teacher: teacherOpen, tlogin: teacherLogin, close: closeModal,
  copy: async () => { try { await navigator.clipboard.writeText(AI_PROMPT); } catch (e) { const r = document.createRange(); r.selectNodeContents($("#aiPrompt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand("copy"); } catch (x) {} } toast("Đã sao chép prompt"); },
  und: v => { if (S.done) return; S.exitTicket.und = +v; save(); document.querySelectorAll("#undBox button").forEach((b, i) => { b.classList.toggle("on", i + 1 === +v); b.setAttribute("aria-pressed", i + 1 === +v); }); },
  exitSend: submitExit,
  fastReview: () => { closeModal(); go(1); },
  fastOk: () => { S.fastAck = true; closeModal(); submitExit(); }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-do]"); if (!b || b.disabled) return;
  const id = b.dataset.act, d = b.dataset.do, v = b.dataset.v;
  if (id && ACT[id]) { H[ACT[id].type](id, ACT[id], d, v); save(); renderAct(id); chrome(); }
  else if (G[d]) G[d](v);
});
document.addEventListener("input", e => {
  const t = e.target; if (!S) return;
  if (t.dataset.act && t.dataset.k) { A(t.dataset.act).st[t.dataset.k] = t.type === "checkbox" ? t.checked : t.value; saveSoon(); }
  else if (t.dataset.exit === "diff") { const s = new Set(S.exitTicket.diff || []); t.checked ? s.add(t.value) : s.delete(t.value); S.exitTicket.diff = DIFFS.filter(d => s.has(d)); saveSoon(); }
  else if (t.dataset.exit) { S.exitTicket[t.dataset.exit] = t.value; saveSoon(); }
  else if (t.dataset.mm) { const k = t.dataset.mm[0], i = +t.dataset.mm[1]; S.mindmap[k][i] = t.value; $("#mmPrev").innerHTML = mmSVG(S.mindmap); saveSoon(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "selC") { const c = e.target.value, s = $("#selS"); s.disabled = !c; s.innerHTML = `<option value="">-- Họ tên --</option>` + ROSTER.filter(r => r.cls === c).map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join(""); $("#startBtn").disabled = true; }
  else if (e.target.id === "selS") $("#startBtn").disabled = !e.target.value;
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "tcode") teacherLogin(); if (e.key === "Escape" && $("#layer .ov") && !$("#layer h2").textContent.includes("RẤT NHANH")) closeModal(); });
window.addEventListener("beforeunload", save);

/* ================= KHỞI ĐỘNG ================= */
(function init() {
  const last = lsGet("b11:last"), s = last && lsGet("b11:" + last);
  if (s && s.studentKey) { S = s; S.syncQueue = S.syncQueue || []; recalc(); view = S.done ? 6 : S.page || 1; }
  render(); loadRoster(); flush();
})();
</script>
</body>
</html>
