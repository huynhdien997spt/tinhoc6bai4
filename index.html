<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tin học 6 – Bài 4. Mạng máy tính</title>
<style>

.hero{background:linear-gradient(135deg,var(--blue),#1e88e5);color:#fff;border-radius:22px;padding:34px 20px;text-align:center;position:relative;overflow:hidden}

.note.ok{background:#e6f7ec;border-color:var(--ok)}.note.bad{background:#fdecea;border-color:var(--bad)}.note.warn{background:#fff3e0;border-color:var(--orange)}

.opt{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}

.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;background:#f5f8fc;border-radius:12px;margin:8px 0}

.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.zone{border:2px dashed #9dbde8;border-radius:14px;padding:10px;min-height:96px;background:#fbfdff;cursor:pointer}
.zone.over{background:#dbeafe}.zone h4{margin:0 0 6px;font-size:.95rem;color:var(--blue2)}

.ln{stroke:var(--blue);stroke-width:3.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.ln.wl{stroke:var(--orange);stroke-dasharray:3 7}.ln.off{stroke:#b8c0cc;stroke-dasharray:2 8}.ln.tmp{stroke:#90a4ae;stroke-dasharray:5 5}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;touch-action:none;padding:4px 8px;border-radius:12px;background:#fff;border:2px solid var(--line);min-width:66px;box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:2}
.node .ico{font-size:28px;line-height:1.15}.node .lbl{font-size:11.5px;font-weight:700;text-align:center;max-width:110px}
.node.pick{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,0,.35)}
.node.good{border-color:var(--ok);background:#e6f7ec}.node.dim{opacity:.35}.node.gone{opacity:.3;filter:grayscale(1);border-style:dashed}
.node.selA{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,101,192,.3)}.node.selB{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,0,.35)}
.node.selA::after,.node.selB::after{position:absolute;top:-12px;font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:0 6px}
.node.selA::after{content:"GỬI";background:var(--blue)}.node.selB::after{content:"NHẬN";background:var(--orange)}
.node.buzz{animation:shake .5s 4}
.pkt{position:absolute;transform:translate(-50%,-50%);font-size:24px;z-index:5;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.file{position:absolute;transform:translate(-50%,-50%);z-index:4;background:#fff;border:2px solid var(--orange);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.85rem;cursor:grab;white-space:nowrap}
.file.pick{background:var(--orange);color:#fff}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--blue);border-radius:12px;padding:6px 10px;font-size:.82rem;font-weight:600;z-index:6;max-width:200px;animation:pop .3s}
.city{width:100%;background:linear-gradient(#dff1ff,#e9f7e4);border-radius:16px;border:2px solid var(--line)}
.city .roads path{stroke:#607d8b;stroke-width:12;stroke-linecap:round;fill:none;stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 1.6s}
.city.on .roads path{stroke-dashoffset:0}
.city .movers{opacity:0;transition:opacity .5s 1.4s}.city.on .movers{opacity:1}
.bigwords{font-size:1.8rem;font-weight:800;text-align:center;color:var(--orange);animation:pop .6s}
.sent{font-size:1.05rem;padding:10px;background:#f5f8fc;border-radius:12px;line-height:2.4}
.slot{display:inline-flex;flex-wrap:wrap;gap:6px;min-width:120px;min-height:38px;border-bottom:3px solid var(--blue);vertical-align:middle;padding:2px}
.situ{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}.sico{font-size:44px;grid-row:span 3}
.emo{display:flex;gap:8px;flex-wrap:wrap}.emo button{font:inherit;font-size:1.5rem;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer}
.emo button.sel{border-color:var(--orange);background:#fff3e0;transform:scale(1.1)}
.mm{width:100%;aspect-ratio:1000/600;background:#fbfdff;border:2px solid var(--line);border-radius:16px;touch-action:none;user-select:none}
.mm .mn{cursor:grab}.mm .mn.sel rect{stroke:#000;stroke-dasharray:5 3}
.mmbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f5f8fc;border-radius:12px;padding:8px;margin:8px 0;min-height:56px}
.mmbar input{width:210px}.mmbar .ic,.mmbar .sw{font:inherit;border:2px solid transparent;background:#fff;border-radius:8px;cursor:pointer;padding:2px 5px}
.mmbar .sw{width:24px;height:24px;border-radius:50%;padding:0}.mmbar .ic:hover,.mmbar .sw:hover{border-color:var(--ink)}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-weight:700;animation:pop .3s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.xp{background:var(--orange)}.toast.bad{background:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(10,25,50,.55);z-index:50;overflow:auto;padding:20px}
#modal .card{max-width:920px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--sky);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.6rem;color:var(--blue2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:7px 8px;border-bottom:1px solid #e3eaf3;text-align:left;vertical-align:top}th{background:var(--sky);position:sticky;top:0}
.tw{overflow:auto;max-height:440px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#eef2f7}.bar span{display:block;height:100%}
.lg{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:.8rem}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.filters{display:flex;flex-wrap:wrap;gap:10px}.filters>div{flex:1;min-width:150px}
.tbtn{position:fixed;left:10px;bottom:10px;font-size:.75rem;opacity:.6;z-index:5}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;background:#eef2f7}
.pill.g{background:#dff5e6;color:var(--ok)}.pill.o{background:#fff3e0;color:#b45f00}.pill.b{background:#dbeafe;color:var(--blue2)}
@media(max-width:640px){.stg span{display:none}.hero h1{font-size:1.7rem}.node .ico{font-size:22px}.node{min-width:52px;padding:2px 4px}}
</style>

<body>
<div id="demoBar" hidden>🧪 CHẾ ĐỘ XEM THỬ – chưa cấu hình <code>APP_CONFIG.gasUrl</code>. Dữ liệu chỉ lưu tạm trên trình duyệt này, KHÔNG gửi về Google Sheets.</div>
<header id="hdr" hidden></header>
<main id="app"></main>
<div id="toasts"></div>
<div id="modal" hidden></div>

<script>
"use strict";
/* ============================================================
   CẤU HÌNH – chỉ cần sửa gasUrl
   ============================================================ */
const APP_CONFIG = {
    teacherName: "Huỳnh Văn Diễn",
    lessonTitle: "Bài 4. Mạng máy tính",
    grade: "6",
    schoolYear: "2026-2027",
    gasUrl: "https://script.google.com/macros/s/AKfycbxfk59uwwM9HfCPpc4eXF3spGvL5w-0IJw5xHfiTmaXa1d2Mudb32o4XrVR2NzArclYdw/exec"
};

/* ============================================================
   TIỆN ÍCH CHUNG
   ============================================================ */
const NS = "tinhoc6_bai4_";
const DEMO = !/^https:\/\/script\.google\.com\//.test(APP_CONFIG.gasUrl);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const app = $("#app"), hdr = $("#hdr"), modal = $("#modal");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); }));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mk(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function toast(msg, cls) { const t = mk("div", "toast " + (cls || "")); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 2600); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function note(el, html, cls) { const d = mk("div", "note " + (cls || ""), html); el.appendChild(d); return d; }
function nextBtn(el, label, fn) { const b = mk("button", "btn big orange"); b.type = "button"; b.textContent = label; b.onclick = () => { b.disabled = true; fn(); }; const w = mk("div", "center"); w.appendChild(b); el.appendChild(w); return b; }
function seq(el, parts, onAll) { let i = 0; const go = () => { if (i >= parts.length) return onAll(); const d = mk("div", "part"); el.appendChild(d); const f = parts[i++]; f(d, go); if (i > 1 && d.scrollIntoView) d.scrollIntoView({ behavior: "smooth", block: "center" }); }; go(); }

/* ============================================================
   GỌI BACKEND (Google Apps Script) + CHẾ ĐỘ XEM THỬ
   ============================================================ */
async function api(action, payload) {
    if (DEMO) { await sleep(120); return demoApi(action, payload || {}); }
    const res = await fetch(APP_CONFIG.gasUrl, {
        method: "POST", redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },   // text/plain => không phát sinh preflight CORS
        body: JSON.stringify(Object.assign({ action }, payload || {}))
    });
    if (!res.ok) throw new Error("NETWORK");
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || "Lỗi máy chủ"); e.server = true; throw e; }
    return j.data;
}

/* --- Backend giả lập, CHỈ dùng khi chưa cấu hình gasUrl để giáo viên xem thử --- */
function demoApi(action, p) {
    const K = NS + "DEMO_db", db = lsGet(K, { students: [], responses: [], tickets: [], classes: [], seen: {} });
    const save = () => lsSet(K, db), now = () => new Date().toISOString();
    const cls = (n, y) => db.classes.find(c => c.name === n && c.year === y);
    const find = id => db.students.find(s => s.studentId === id);
    const fail = m => { const e = new Error(m); e.server = true; throw e; };
    const statusOk = (s, st) => { const t = db.tickets.some(x => x.studentId === s.studentId); return !st || (st === "s1no" && !s.s1) || (st === "s1yes" && s.s1) || (st === "s2no" && s.s1 && !s.s2Started) || (st === "s2doing" && s.s2Started && !s.completed) || (st === "done" && s.completed) || (st === "nomm" && !t); };
    const flt = () => db.students.filter(s => (!p.schoolYear || s.schoolYear === p.schoolYear) && (!p.className || s.className === p.className));
    switch (action) {
        case "getClasses": return db.classes.filter(c => c.year === p.schoolYear).map(c => c.name);
        case "registerStudent": {
            const name = String(p.fullName || "").trim(), c = String(p.className || "").toUpperCase().replace(/\s+/g, "");
            if (name.length < 2 || !c) fail("Thiếu họ tên hoặc lớp.");
            let max = 0; db.students.forEach(s => { if (s.className === c && s.schoolYear === p.schoolYear) max = Math.max(max, +s.learningCode.split("-").pop()); });
            const s = { studentId: uuid(), learningCode: c + "-" + String(max + 1).padStart(3, "0"), fullName: name, className: c, schoolYear: p.schoolYear, startTime: now(), s1: false, s1Time: "", s2Started: false, completed: false, completedTime: "", stage: "s1a", progress: 0, score: "", xp: 0, lastAccess: now() };
            db.students.push(s); if (!cls(c, p.schoolYear)) db.classes.push({ name: c, year: p.schoolYear, active: true, unlocked: false }); save(); return s;
        }
        case "getStudentProgress": {
            const code = String(p.learningCode || "").toUpperCase().trim(), s = db.students.slice().reverse().find(x => x.learningCode === code);
            if (!s) fail("Không tìm thấy mã học tập này.");
            const c = cls(s.className, s.schoolYear), t = db.tickets.find(x => x.studentId === s.studentId);
            return { student: s, session2Unlocked: !!(c && c.unlocked), mindmapJSON: t ? t.mindmapJSON : "" };
        }
        case "checkClassSession": { const c = cls(p.className, p.schoolYear); return { session2Unlocked: !!(c && c.unlocked) }; }
        case "syncBatch": {
            (p.events || []).forEach(ev => {
                if (db.seen[ev.eventId]) return; db.seen[ev.eventId] = 1;
                const s = find(ev.StudentID), d = ev.Data || {}; if (!s || s.learningCode !== ev.LearningCode) return;
                s.lastAccess = now();
                const prog = () => { if (d.currentStage) s.stage = d.currentStage; s.progress = Math.max(s.progress, +d.progress || 0); s.xp = Math.max(s.xp, +d.xp || 0); if (d.totalScore !== undefined && d.totalScore !== "") s.score = d.totalScore; if (d.session2Started) s.s2Started = true; };
                if (ev.action === "saveResponse") db.responses.push(Object.assign({ studentId: s.studentId, learningCode: s.learningCode, className: s.className, time: ev.Timestamp }, d));
                else if (ev.action === "updateProgress") prog();
                else if (ev.action === "completeSession1") { prog(); if (!s.s1) { s.s1 = true; s.s1Time = now(); } }
                else if (ev.action === "submitExitTicket") { prog(); s.completed = true; s.completedTime = now(); s.progress = 100; db.tickets = db.tickets.filter(t => t.studentId !== s.studentId); db.tickets.push({ studentId: s.studentId, learningCode: s.learningCode, fullName: s.fullName, className: s.className, learned: d.learned, understanding: d.understanding, question: d.question, realLife: d.realLife, mindmapJSON: d.mindmapJSON, time: now() }); }
            });
            save(); return { processed: (p.events || []).length };
        }
        case "teacherLogin": if (!p.password) fail("Sai mật khẩu."); return { token: "demo-token" };
        case "teacherLogout": return {};
        case "getDashboard": {
            const st = flt(), ids = new Set(st.map(s => s.studentId)), agg = {};
            db.responses.forEach(r => { if (!ids.has(r.studentId) || r.correct === "") return; const k = r.activity + "|" + r.question, a = agg[k] || (agg[k] = { activity: r.activity, question: r.question, total: 0, wrong: 0 }); a.total++; if (!r.correct) a.wrong++; });
            return { years: Array.from(new Set(db.classes.map(c => c.year))), classes: db.classes.filter(c => !p.schoolYear || c.year === p.schoolYear), students: st, tickets: db.tickets.filter(t => ids.has(t.studentId)).map(t => ({ studentId: t.studentId, understanding: t.understanding })), wrong: Object.values(agg).filter(a => a.wrong).sort((a, b) => b.wrong - a.wrong).slice(0, 8) };
        }
        case "getStudents": return flt().filter(s => statusOk(s, p.status)).map(s => Object.assign({ hasTicket: db.tickets.some(t => t.studentId === s.studentId) }, s));
        case "getStudentDetail": return { student: find(p.studentId), responses: db.responses.filter(r => r.studentId === p.studentId), ticket: db.tickets.find(t => t.studentId === p.studentId) || null };
        case "setSession2Unlocked": { let c = cls(p.className, p.schoolYear); if (!c) { c = { name: p.className, year: p.schoolYear, active: true, unlocked: false }; db.classes.push(c); } c.unlocked = !!p.unlocked; save(); return { className: c.name, unlocked: c.unlocked }; }
    }
    fail("Hành động không hợp lệ: " + action);
}

/* ============================================================
   PHIÊN HỌC SINH + HÀNG ĐỢI ĐỒNG BỘ
   S = phiên đang hoạt động (chỉ nằm trong bộ nhớ trang + sessionStorage)
   ============================================================ */
let S = null, flushing = false, netOk = true;
const qGet = () => lsGet(NS + "queue", []);
const qSet = q => lsSet(NS + "queue", q);
function enqueue(action, data) {
    if (!S) return;
    const q = qGet();
    q.push({ eventId: uuid(), action, StudentID: S.id, LearningCode: S.code, Activity: data.activity || action, Timestamp: new Date().toISOString(), Data: data });
    qSet(q); syncBadge(); setTimeout(flush, 1200);
}
async function flush(all) {
    if (flushing) return; flushing = true;
    try {
        do {
            const batch = qGet().slice(0, 25); if (!batch.length) break;
            await api("syncBatch", { events: batch });
            const ids = new Set(batch.map(e => e.eventId));
            qSet(qGet().filter(e => !ids.has(e.eventId))); netOk = true;
        } while (all);
    } catch (e) { netOk = false; }
    finally { flushing = false; syncBadge(); if (qGet().length && !all) setTimeout(flush, netOk ? 800 : 7000); }
}
function syncBadge() { const b = $("#sync"); if (!b) return; const n = qGet().length; b.textContent = n ? (netOk ? "⏳ Đang lưu…" : "📴 Mất kết nối – còn " + n + " thao tác chờ gửi") : "☁️ Đã lưu"; }
function saveCache() { if (!S) return; lsSet(NS + S.id + "_progress", { idx: S.idx, xp: S.xp, score: S.score, s1: S.s1, s2s: S.s2s, completed: S.completed, name: S.name, cls: S.cls, year: S.year, code: S.code }); lsSet(NS + "code_" + S.code, S.id); }
function award(n) { if (!S || !n) return; S.xp += n; const x = $("#xpv"); if (x) x.textContent = S.xp; toast("+" + n + " XP ⭐", "xp"); }
function logResp(activity, question, answer, correct, attempts, score, xp) {
    if (!S) return;
    enqueue("saveResponse", { session: S.completed ? 2 : STEPS[Math.min(S.idx, STEPS.length - 1)].ses, activity, question, answer: String(answer).slice(0, 500), correct, attempts: attempts || 1, score: score || 0, xp: xp || 0 });
}
const pct = () => !S ? 0 : S.completed ? 100 : Math.round(S.idx / STEPS.length * 100);
function saveProgress(extra) { if (!S) return; saveCache(); enqueue("updateProgress", Object.assign({ currentStage: S.completed ? "done" : STEPS[S.idx].id, progress: pct(), xp: S.xp, totalScore: S.score, session2Started: S.s2s }, extra || {})); }
function openSession(stu, extra) {
    const idx = STEPS.findIndex(s => s.id === stu.stage);
    S = { id: stu.studentId, code: stu.learningCode, name: stu.fullName, cls: stu.className, year: stu.schoolYear, idx: idx < 0 ? 0 : idx, xp: +stu.xp || 0, score: stu.score === undefined ? "" : stu.score, s1: !!stu.s1, s2s: !!stu.s2Started, completed: !!stu.completed, mind: null };
    Object.assign(S, extra || {});
    const c = lsGet(NS + S.id + "_progress", null);          // cache riêng của CHÍNH học sinh này (nếu máy này từng học dở)
    if (c && !S.completed && c.idx > S.idx) { S.idx = Math.min(c.idx, STEPS.length - 1); S.xp = Math.max(S.xp, c.xp || 0); S.s1 = S.s1 || !!c.s1; S.s2s = S.s2s || !!c.s2s; if (c.score !== "" && c.score != null) S.score = c.score; }
    try { sessionStorage.setItem("activeStudentId", S.id); sessionStorage.setItem("activeLearningCode", S.code); } catch (e) { }
    saveCache(); renderHdr();
}
async function endSession() {
    const b = $("#endBtn");
    if (b && !b.dataset.c) { b.dataset.c = "1"; b.textContent = "Bấm lần nữa để xác nhận"; setTimeout(() => { if (b.isConnected) { delete b.dataset.c; b.textContent = "🚪 Kết thúc phiên"; } }, 3000); return; }
    saveCache();
    app.innerHTML = '<div class="card center"><h2>⏳ Đang lưu và đồng bộ dữ liệu…</h2></div>';
    await Promise.race([(async () => { while (flushing) await sleep(150); await flush(true); })(), sleep(9000)]);
    const left = qGet().length;
    try { sessionStorage.removeItem("activeStudentId"); sessionStorage.removeItem("activeLearningCode"); } catch (e) { }
    S = null; renderHdr();
    viewWelcome(left ? "📴 Còn " + left + " thao tác chưa gửi được – sẽ tự gửi khi có mạng. Đừng xoá dữ liệu trình duyệt nhé!" : "✅ Đã lưu bài và kết thúc phiên. Hẹn gặp lại em!");
}

const STAGES = ["🌐 Mạng lưới quanh em", "🤝 Mạng máy tính & chia sẻ", "🖥️ Ai là ai trong mạng?", "🔌 Kết nối mạng – Thử thách kỹ sư", "🧠 Quiz + Mindmap"];

/* ============================================================
   THÀNH PHẦN TƯƠNG TÁC DÙNG CHUNG
   ============================================================ */
/* Trắc nghiệm: không lộ đáp án trước, cho thử lại, ghi số lần thử */
function mcq(el, c) {
    const L = "ABCDEF", box = mk("div", "mcq");
    box.innerHTML = `<p class="q">${c.q}</p>${c.multi ? '<p class="hint">☑️ Có thể chọn nhiều đáp án, rồi bấm Kiểm tra.</p>' : ""}<div class="opts">${c.opts.map((o, i) => `<button type="button" class="opt"><b>${L[i]}.</b> ${o}</button>`).join("")}</div>${c.multi ? '<button type="button" class="btn chk">Kiểm tra</button>' : ""}<div class="fb"></div>`;
    el.appendChild(box);
    const ans = new Set(c.ans), tries = c.tries || 2, fb = $(".fb", box), opts = $$(".opt", box); let n = 0, fin = false;
    const end = (ok, ch) => {
        fin = true; opts.forEach((b, i) => { b.disabled = true; if (ans.has(i)) b.classList.add("right"); else if (ch.includes(i)) b.classList.add("wrong"); });
        const ck = $(".chk", box); if (ck) ck.remove();
        const first = ok && n === 1, xp = ok ? (first ? (c.xp || 0) : Math.floor((c.xp || 0) / 2)) : 0;
        fb.className = "fb " + (ok ? "ok" : "bad"); fb.innerHTML = (ok ? "✅ Chính xác! " : "💡 Đáp án đúng được tô xanh. ") + (c.explain || "");
        logResp(c.act || "MCQ", strip(c.q), ch.map(i => L[i]).join(","), first, n, first ? 1 : 0, xp); award(xp);
        if (c.onDone) c.onDone(first, n, ch);
    };
    const judge = ch => { n++; const ok = ch.length === ans.size && ch.every(i => ans.has(i)); if (ok || n >= tries) { end(ok, ch); return true; } fb.className = "fb bad"; fb.textContent = "❌ Chưa đúng, em suy nghĩ và thử lại nhé!"; return false; };
    opts.forEach((b, i) => b.onclick = () => { if (fin) return; if (c.multi) b.classList.toggle("sel"); else if (!judge([i])) { b.classList.add("wrong"); b.disabled = true; } });
    if (c.multi) $(".chk", box).onclick = () => { const ch = opts.map((b, i) => b.classList.contains("sel") ? i : -1).filter(i => i >= 0); if (!ch.length) { fb.className = "fb bad"; fb.textContent = "Em hãy chọn ít nhất một đáp án."; return; } judge(ch); };
}
/* Câu hỏi dự đoán: không chấm đúng/sai */
function predict(el, q, opts, act, cb) {
    const box = mk("div", "mcq", `<p class="q">🤔 ${q}</p><div class="opts">${opts.map(o => `<button type="button" class="opt">${o}</button>`).join("")}</div>`);
    el.appendChild(box);
    $$(".opt", box).forEach((b, i) => b.onclick = () => { $$(".opt", box).forEach(x => x.disabled = true); b.classList.add("sel"); logResp(act, q, opts[i], "", 1, 0, 0); cb(i); });
}
/* Kéo thả phân loại: kéo thẻ vào ô, hoặc bấm thẻ rồi bấm ô. Phản hồi ngay. */
function classify(el, cfg) {
    const box = mk("div", "", `<p class="hint">🖱️ Kéo thẻ vào ô phù hợp (hoặc bấm vào thẻ rồi bấm vào ô).</p><div class="pool"></div><div class="zones">${cfg.zones.map(z => `<div class="zone" data-z="${z.id}"><h4>${z.label}</h4><div class="in"></div></div>`).join("")}</div><div class="fb"></div>`);
    el.appendChild(box);
    const pool = $(".pool", box), fb = $(".fb", box); let sel = null, wrong = 0, left = cfg.items.length;
    shuffle(cfg.items).forEach(it => {
        const c = mk("div", "chip"); c.textContent = it.label; c.draggable = true; c._it = it; pool.appendChild(c);
        c.ondragstart = e => { sel = c; try { e.dataTransfer.setData("text/plain", it.id); } catch (x) { } };
        c.onclick = e => { if (c.classList.contains("placed")) return; e.stopPropagation(); if (sel) sel.classList.remove("pick"); sel = sel === c ? null : c; if (sel) sel.classList.add("pick"); };
    });
    const place = z => {
        if (!sel || sel.classList.contains("placed")) return; const c = sel, it = c._it; sel = null; c.classList.remove("pick");
        const ok = [].concat(it.zone).includes(z.dataset.z);
        if (ok) { c.classList.add("placed"); c.draggable = false; $(".in", z).appendChild(c); fb.className = "fb ok"; fb.textContent = "✅ " + (it.ok || "Đúng rồi!"); if (--left === 0) { logResp(cfg.act, cfg.title || cfg.act, "Số lần đặt sai: " + wrong, wrong === 0, wrong + 1, wrong === 0 ? 1 : 0, 0); cfg.onDone(wrong); } }
        else { wrong++; c.classList.add("shake"); setTimeout(() => c.classList.remove("shake"), 450); fb.className = "fb bad"; fb.textContent = "❌ " + (it.no || "Chưa đúng, em thử ô khác nhé!"); }
    };
    $$(".zone", box).forEach(z => { z.ondragover = e => { e.preventDefault(); z.classList.add("over"); }; z.ondragleave = () => z.classList.remove("over"); z.ondrop = e => { e.preventDefault(); z.classList.remove("over"); place(z); }; z.onclick = () => place(z); });
}
/* Sân mô phỏng mạng: thiết bị (node) + dây nối + gói dữ liệu chạy trên dây */
function scene(el, nodes, h) {
    const SV = "http://www.w3.org/2000/svg", box = mk("div", "scene"); box.style.height = (h || 300) + "px";
    const svg = document.createElementNS(SV, "svg"); svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("preserveAspectRatio", "none"); box.appendChild(svg); el.appendChild(box);
    const N = {}, L = new Map(); let linking = null, onNode = null, pick = null, dragFrom = null, tmp = null;
    const key = (a, b) => a < b ? a + "|" + b : b + "|" + a;
    const mkLine = (a, b, cls) => { const l = document.createElementNS(SV, "line"); l.setAttribute("x1", a.x); l.setAttribute("y1", a.y); l.setAttribute("x2", b.x); l.setAttribute("y2", b.y); l.setAttribute("class", "ln " + (cls || "")); svg.appendChild(l); return l; };
    const sc = {
        box, N, L,
        addNode(n) { const d = mk("div", "node " + (n.cls || ""), `<span class="ico">${n.icon}</span><span class="lbl">${n.label || ""}</span>`); d.dataset.id = n.id; d.style.left = n.x + "%"; d.style.top = n.y + "%"; box.appendChild(d); N[n.id] = Object.assign({ el: d }, n); d.addEventListener("click", () => click(n.id)); },
        removeNode(id) { if (!N[id]) return; Array.from(L.values()).forEach(l => { if (l.a === id || l.b === id) sc.unlink(l.a, l.b); }); N[id].el.remove(); delete N[id]; },
        link(a, b, cls) { const k = key(a, b); if (L.has(k) || !N[a] || !N[b]) return; L.set(k, { a, b, el: mkLine(N[a], N[b], cls) }); },
        unlink(a, b) { const k = key(a, b), l = L.get(k); if (l) { l.el.remove(); L.delete(k); } },
        has: (a, b) => L.has(key(a, b)),
        clear() { Array.from(L.values()).forEach(l => sc.unlink(l.a, l.b)); unpick(); },
        path(a, b) { const prev = { [a]: null }, q = [a]; while (q.length) { const u = q.shift(); if (u === b) { const p = []; for (let x = b; x != null; x = prev[x]) p.unshift(x); return p; } L.forEach(l => { const v = l.a === u ? l.b : l.b === u ? l.a : null; if (v && !(v in prev)) { prev[v] = u; q.push(v); } }); } return null; },
        send(ids, emoji, per) { const p = mk("div", "pkt"); p.textContent = emoji || "📦"; p.style.left = N[ids[0]].x + "%"; p.style.top = N[ids[0]].y + "%"; box.appendChild(p); if (ids.length < 2 || !p.animate) return sleep(300).then(() => p); const an = p.animate(ids.map(i => ({ left: N[i].x + "%", top: N[i].y + "%" })), { duration: (per || 650) * (ids.length - 1), easing: "linear", fill: "forwards" }); return (an.finished || sleep((per || 650) * (ids.length - 1))).then(() => p); },
        setLinking(o) { linking = o; unpick(); },
        onNode(f) { onNode = f; },
        bubble(id, text, ms) { const b = mk("div", "bubble"); b.textContent = text; b.style.left = N[id].x + "%"; b.style.top = (N[id].y - 14) + "%"; box.appendChild(b); setTimeout(() => b.remove(), ms || 3500); }
    };
    function unpick() { if (pick && N[pick]) N[pick].el.classList.remove("pick"); pick = null; }
    function toggle(a, b) { if (linking.can && linking.can(a, b) === false) return; sc.has(a, b) ? sc.unlink(a, b) : sc.link(a, b, linking.cls); if (linking.change) linking.change(); }
    function click(id) { if (linking) { if (!pick) { pick = id; N[id].el.classList.add("pick"); } else if (pick === id) unpick(); else { const a = pick; unpick(); toggle(a, id); } } else if (onNode) onNode(id, N[id]); }
    box.addEventListener("pointerdown", e => { const nd = e.target.closest && e.target.closest(".node"); if (linking && nd) dragFrom = nd.dataset.id; });
    box.addEventListener("pointermove", e => { if (!dragFrom || !N[dragFrom]) return; const r = box.getBoundingClientRect(), p = { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 }; if (!tmp) tmp = mkLine(N[dragFrom], p, "tmp"); else { tmp.setAttribute("x2", p.x); tmp.setAttribute("y2", p.y); } });
    const up = e => { if (!dragFrom) return; const a = dragFrom; dragFrom = null; if (tmp) { tmp.remove(); tmp = null; } const t = document.elementFromPoint ? document.elementFromPoint(e.clientX, e.clientY) : null, nd = t && t.closest && t.closest(".node"); if (linking && nd && box.contains(nd) && nd.dataset.id !== a && N[a]) { unpick(); toggle(a, nd.dataset.id); } };
    box.addEventListener("pointerup", up); box.addEventListener("pointercancel", () => { dragFrom = null; if (tmp) { tmp.remove(); tmp = null; } });
    nodes.forEach(sc.addNode);
    return sc;
}
/* Tệp có thể kéo từ máy này sang máy kia (hoặc bấm tệp rồi bấm máy nhận) */
function fileChip(sc, from, to, label, onTry) {
    const c = mk("div", "file"); c.textContent = label; c.draggable = true; c.style.left = sc.N[from].x + "%"; c.style.top = (sc.N[from].y + 24) + "%"; sc.box.appendChild(c);
    let sel = false; const t = sc.N[to].el;
    const go = () => { sel = false; c.classList.remove("pick"); onTry(c); };
    c.onclick = () => { sel = !sel; c.classList.toggle("pick", sel); };
    c.ondragstart = e => { sel = true; try { e.dataTransfer.setData("text/plain", "file"); } catch (x) { } };
    t.ondragover = e => e.preventDefault(); t.ondrop = e => { e.preventDefault(); go(); };
    t.addEventListener("click", () => { if (sel) go(); });
    return c;
}

    function barDraw() {
        const n = by(sel);
        if (!n) { bar.innerHTML = '<span class="hint">👆 Bấm vào một ô trong sơ đồ để sửa, thêm nhánh con, đổi biểu tượng hoặc màu.</span>'; return; }
        const fixed = n.id === "r" || n.p === "r" && /^b[1-4]$/.test(n.id);
        bar.innerHTML = `<input type="text" id="mt" maxlength="22" value="${esc(n.t)}" ${n.id === "r" ? "disabled" : ""} placeholder="Từ khoá (tối đa 22 kí tự)"><button type="button" class="btn sm" id="ma">➕ Thêm nhánh con</button>${fixed ? "" : '<button type="button" class="btn sm red" id="md">🗑 Xoá</button>'}<span>${MM_ICONS.map(i => `<button type="button" class="ic" data-i="${i}">${i || "∅"}</button>`).join("")}</span>${n.id === "r" ? "" : `<span>${MM_COLORS.map(c => `<button type="button" class="sw" data-c="${c}" style="background:${c}" title="Đổi màu nhánh"></button>`).join("")}</span>`}`;
        $("#mt", bar).oninput = e => { n.t = e.target.value; draw(); };
        $("#ma", bar).onclick = () => {
            if (M.nodes.length >= 40) { toast("Sơ đồ đã đủ nhiều nhánh rồi!"); return; }
            const kids = M.nodes.filter(k => k.p === n.id), side = n.id === "r" ? (kids.filter(k => k.x < 500).length <= kids.filter(k => k.x >= 500).length ? -1 : 1) : (n.x < 500 ? -1 : 1);
            const c = { id: "n" + Date.now().toString(36) + Math.floor(Math.random() * 99), p: n.id, t: "", i: "", x: clamp(n.x + side * (n.id === "r" ? 300 : 185), 70, 930), y: clamp(n.id === "r" ? 300 : n.y - 55 + kids.length * 44, 25, 575) };
            if (n.id === "r") c.c = MM_COLORS[(kids.length) % MM_COLORS.length];
            M.nodes.push(c); sel = c.id; draw(); barDraw(); const t = $("#mt", bar); if (t) t.focus();
        };
        const del = $("#md", bar); if (del) del.onclick = () => { const kill = new Set([n.id]); let more = true; while (more) { more = false; M.nodes.forEach(k => { if (kill.has(k.p) && !kill.has(k.id)) { kill.add(k.id); more = true; } }); } M.nodes = M.nodes.filter(k => !kill.has(k.id)); sel = null; draw(); barDraw(); };
        $$(".ic", bar).forEach(b => b.onclick = () => { n.i = b.dataset.i; draw(); });
        $$(".sw", bar).forEach(b => b.onclick = () => { const m = mainOf(n); if (m) { m.c = b.dataset.c; draw(); } });
    }
    const pt = e => { const r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 1000, y: (e.clientY - r.top) / r.height * 600 }; };
    svg.addEventListener("pointerdown", e => { const g = e.target.closest && e.target.closest(".mn"); if (!g) { sel = null; draw(); barDraw(); return; } const n = by(g.dataset.id), p = pt(e); if (sel !== n.id) { sel = n.id; barDraw(); } drag = { n, dx: n.x - p.x, dy: n.y - p.y }; draw(); });
    svg.addEventListener("pointermove", e => { if (!drag) return; const p = pt(e); drag.n.x = Math.round(clamp(p.x + drag.dx, 40, 960)); drag.n.y = Math.round(clamp(p.y + drag.dy, 20, 580)); mmRender(svg, M, sel); });
    const stop = () => { if (drag) { drag = null; lsSet(key, M); } }; svg.addEventListener("pointerup", stop); svg.addEventListener("pointerleave", stop); svg.addEventListener("pointercancel", stop);
    $("#hb", el).onclick = () => { $("#ht", el).textContent = " " + (hint % 5 + 1) + "/5: " + HINTS[hint % 5]; hint++; };
    $$("#e2 button", el).forEach(b => b.onclick = () => { und = +b.dataset.v; $$("#e2 button", el).forEach(x => x.classList.toggle("sel", x === b)); });
    $("#sub", el).onclick = () => {
        const fb = $("#efb", el), main = M.nodes.filter(n => n.p === "r"), blank = M.nodes.filter(n => !n.t.trim());
        const thin = main.filter(m => /^b[1-4]$/.test(m.id) && M.nodes.filter(n => n.p === m.id).length < 2);
        const v1 = $("#e1", el).value.trim(), v3 = $("#e3", el).value.trim(), v4 = $("#e4", el).value.trim();
        if (blank.length) { fb.textContent = "Sơ đồ còn " + blank.length + " ô chưa có chữ. Em điền từ khoá hoặc xoá ô đó nhé."; sel = blank[0].id; draw(); barDraw(); return; }
        if (thin.length) { fb.textContent = "Nhánh “" + thin[0].t + "” cần ít nhất 2 nhánh con. Em bổ sung thêm nhé!"; return; }
        if (v1.length < 3) { fb.textContent = "Em hãy viết điều quan trọng nhất em học được (mục 1)."; return; }
        if (!und) { fb.textContent = "Em hãy chọn mức độ hiểu bài (mục 2)."; return; }
        if (v4.length < 3) { fb.textContent = "Em hãy nêu một nơi dùng mạng máy tính trong thực tế (mục 4)."; return; }
        $("#sub", el).disabled = true; fb.textContent = ""; award(30);
        S.completed = true; S.mind = M; saveCache();
        enqueue("submitExitTicket", { activity: "ExitTicket", learned: v1, understanding: und, question: v3, realLife: v4, mindmapJSON: JSON.stringify(M), currentStage: "done", progress: 100, xp: S.xp, totalScore: S.score, session2Started: true });
        viewDone();
    };
    draw(); barDraw();
}

/* ============================================================
   TEACHER MODE (token chỉ nằm trong bộ nhớ trang, không lưu xuống máy)
   ============================================================ */
let T = null;
function tLogin() {
    app.innerHTML = `<div class="card" style="max-width:440px;margin:0 auto"><h2>👨‍🏫 Teacher Mode</h2><label for="tp">Mật khẩu giáo viên</label><input type="password" id="tp" autocomplete="off"><div class="fb bad" id="tfb"></div>
    <div class="center"><button type="button" class="btn big" id="tg">Đăng nhập</button><br><button type="button" class="btn ghost sm" id="tb">← Quay lại</button></div>${DEMO ? '<p class="hint">Chế độ xem thử: nhập mật khẩu bất kì.</p>' : ""}</div>`;
    $("#tb").onclick = () => viewWelcome();
    const go = async () => { $("#tg").disabled = true; try { const r = await api("teacherLogin", { password: $("#tp").value }); T = { token: r.token, year: APP_CONFIG.schoolYear, cls: "", status: "" }; tDash(); } catch (e) { $("#tg").disabled = false; $("#tfb").textContent = e.server ? e.message : "Không kết nối được máy chủ."; } };
    $("#tg").onclick = go; $("#tp").onkeydown = e => { if (e.key === "Enter") go(); }; $("#tp").focus();
}
async function tCall(action, p) { try { return await api(action, Object.assign({ token: T.token }, p || {})); } catch (e) { if (e.server && /đăng nhập|token/i.test(e.message)) { T = null; toast("Phiên giáo viên đã hết hạn", "bad"); viewWelcome(); } throw e; } }
const ST_LABEL = s => s.completed ? '<span class="pill g">Hoàn thành</span>' : s.s2Started ? '<span class="pill b">Đang học Tiết 2</span>' : s.s1 ? '<span class="pill o">Xong Tiết 1</span>' : '<span class="pill">Đang học Tiết 1</span>';
async function tDash() {
    app.innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap"><h2>👨‍🏫 Bảng điều khiển – ${esc(APP_CONFIG.lessonTitle)}</h2><span><button type="button" class="btn ghost sm" id="trf">🔄 Tải lại</button><button type="button" class="btn sm red" id="tout">Đăng xuất</button></span></div>
    <div class="filters"><div><label>NĂM HỌC</label><select id="fy"></select></div><div><label>LỚP</label><select id="fc"></select></div><div><label>TRẠNG THÁI</label><select id="fs"><option value="">Tất cả</option><option value="s1no">Chưa hoàn thành Tiết 1</option><option value="s1yes">Đã hoàn thành Tiết 1</option><option value="s2no">Chưa học Tiết 2</option><option value="s2doing">Đang học Tiết 2</option><option value="done">Hoàn thành</option><option value="nomm">Chưa nộp Mindmap</option></select></div></div></div>
    <div id="tbody"><div class="card center">⏳ Đang tải dữ liệu…</div></div>`;
    $("#tout").onclick = async () => { try { await api("teacherLogout", { token: T.token }); } catch (e) { } T = null; viewWelcome(); };
    $("#trf").onclick = tLoad; $("#fs").value = T.status;
    $("#fy").onchange = e => { T.year = e.target.value; T.cls = ""; tLoad(); }; $("#fc").onchange = e => { T.cls = e.target.value; tLoad(); }; $("#fs").onchange = e => { T.status = e.target.value; tLoad(); };
    tLoad();
}
async function tLoad() {
    const body = $("#tbody"); if (!body || !T) return;
    let D, list;
    try { [D, list] = await Promise.all([tCall("getDashboard", { schoolYear: T.year, className: T.cls }), tCall("getStudents", { schoolYear: T.year, className: T.cls, status: T.status })]); }
    catch (e) { if (T && body.isConnected) body.innerHTML = `<div class="card note bad">Không tải được dữ liệu: ${esc(e.message)}</div>`; return; }
    const years = Array.from(new Set([T.year].concat(D.years || []))).filter(Boolean).sort();
    $("#fy").innerHTML = years.map(y => `<option ${y === T.year ? "selected" : ""}>${esc(y)}</option>`).join("");
    $("#fc").innerHTML = '<option value="">Tất cả lớp</option>' + D.classes.map(c => `<option ${c.name === T.cls ? "selected" : ""}>${esc(c.name)}</option>`).join("");
    const st = D.students, n = st.length, avg = a => a.length ? (a.reduce((x, y) => x + (+y || 0), 0) / a.length).toFixed(1) : "–";
    const sc = st.filter(s => s.score !== "" && s.score != null).map(s => s.score), un = D.tickets.map(t => t.understanding).filter(Boolean);
    const stat = (i, l, v) => `<div class="stat">${i}<b>${v}</b>${l}</div>`;
    const per = {}; st.forEach(s => { const p = per[s.className] || (per[s.className] = [0, 0, 0, 0]); p[s.completed ? 3 : s.s2Started ? 2 : s.s1 ? 1 : 0]++; });
    const COL = ["#c9d3e0", "#ffb74d", "#42a5f5", "#1b9e4b"], LBL = ["Đang học Tiết 1", "Xong Tiết 1", "Đang học Tiết 2", "Hoàn thành"];
    body.innerHTML = `<div class="card"><div class="stats">${stat("👨‍🎓", "Tổng học sinh", n)}${stat("✅", "Hoàn thành Tiết 1", st.filter(s => s.s1).length)}${stat("🔄", "Đang học Tiết 2", st.filter(s => s.s2Started && !s.completed).length)}${stat("🏁", "Hoàn thành bài", st.filter(s => s.completed).length)}${stat("🧠", "Nộp Mindmap", D.tickets.length)}${stat("📊", "Quiz trung bình", avg(sc))}${stat("⭐", "XP trung bình", avg(st.map(s => s.xp)))}${stat("😊", "Mức độ hiểu TB", avg(un))}</div></div>
    <div class="card"><h3>📈 Tiến độ theo lớp & mở Tiết 2</h3><p>${LBL.map((l, i) => `<span class="lg"><i style="background:${COL[i]}"></i>${l}</span>`).join("")}</p>
    <table><tr><th>Lớp</th><th>Sĩ số</th><th style="width:45%">Tiến độ</th><th>Tiết 2</th><th></th></tr>${D.classes.map(c => { const p = per[c.name] || [0, 0, 0, 0], t = p[0] + p[1] + p[2] + p[3]; return `<tr><td><b>${esc(c.name)}</b></td><td>${t}</td><td><div class="bar">${p.map((v, i) => `<span style="width:${t ? v / t * 100 : 0}%;background:${COL[i]}" title="${LBL[i]}: ${v}"></span>`).join("")}</div></td><td>${c.unlocked ? '<span class="pill g">🔓 OPEN</span>' : '<span class="pill">🔒 LOCKED</span>'}</td><td><button type="button" class="btn sm ${c.unlocked ? "ghost" : "green"}" data-cls="${esc(c.name)}" data-u="${c.unlocked ? 0 : 1}">${c.unlocked ? "🔒 KHOÁ TIẾT 2" : "🔓 MỞ TIẾT 2"}</button></td></tr>`; }).join("") || '<tr><td colspan="5" class="hint">Chưa có lớp nào. Lớp sẽ tự xuất hiện khi học sinh đầu tiên đăng ký.</td></tr>'}</table></div>
    <div class="card"><h3>⚠️ Câu học sinh sai nhiều nhất</h3>${D.wrong.length ? `<table><tr><th>Hoạt động</th><th>Câu hỏi</th><th>Sai lần đầu</th></tr>${D.wrong.map(w => `<tr><td>${esc(w.activity)}</td><td>${esc(w.question)}</td><td><b>${w.wrong}/${w.total}</b> (${Math.round(w.wrong / w.total * 100)}%)</td></tr>`).join("")}</table>` : '<p class="hint">Chưa có dữ liệu.</p>'}</div>
    <div class="card"><h3>📋 Danh sách học sinh (${list.length})</h3><div class="tw"><table><tr><th>Mã</th><th>Họ tên</th><th>Lớp</th><th>Tiến độ</th><th>XP</th><th>Quiz</th><th>Trạng thái</th><th>Mindmap</th><th></th></tr>${list.map(s => `<tr><td>${esc(s.learningCode)}</td><td>${esc(s.fullName)}</td><td>${esc(s.className)}</td><td>${+s.progress || 0}%</td><td>${+s.xp || 0}</td><td>${s.score === "" || s.score == null ? "–" : esc(s.score)}</td><td>${ST_LABEL(s)}</td><td>${s.hasTicket ? "✅" : "–"}</td><td><button type="button" class="btn sm ghost" data-sid="${esc(s.studentId)}">Xem</button></td></tr>`).join("") || '<tr><td colspan="9" class="hint">Không có học sinh phù hợp bộ lọc.</td></tr>'}</table></div></div>`;
    $$("[data-cls]", body).forEach(b => b.onclick = async () => { b.disabled = true; try { await tCall("setSession2Unlocked", { className: b.dataset.cls, schoolYear: T.year, unlocked: b.dataset.u === "1" }); toast((b.dataset.u === "1" ? "Đã MỞ" : "Đã KHOÁ") + " Tiết 2 cho lớp " + b.dataset.cls); tLoad(); } catch (e) { b.disabled = false; toast(e.message, "bad"); } });
    $$("[data-sid]", body).forEach(b => b.onclick = () => tDetail(b.dataset.sid));
}
async function tDetail(id) {
    modal.hidden = false; modal.innerHTML = '<div class="card center">⏳ Đang tải…</div>';
    const close = () => { modal.hidden = true; modal.innerHTML = ""; }; modal.onclick = e => { if (e.target === modal) close(); };
    let d; try { d = await tCall("getStudentDetail", { studentId: id }); } catch (e) { modal.innerHTML = `<div class="card note bad">${esc(e.message)}</div>`; return; }
    const s = d.student, t = d.ticket, mm = t && mmParse(t.mindmapJSON), okc = r => r.correct === "" || r.correct == null ? "–" : (r.correct === true || String(r.correct).toUpperCase() === "TRUE") ? "✅" : "❌";
    modal.innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between"><h2>👤 ${esc(s.fullName)} – ${esc(s.className)}</h2><button type="button" class="btn ghost sm" id="mx">✕ Đóng</button></div>
    <p>🎫 <b>${esc(s.learningCode)}</b> · StudentID: <code>${esc(s.studentId)}</code></p>
    <p>🔥 Tiến độ <b>${+s.progress || 0}%</b> · ⭐ <b>${+s.xp || 0} XP</b> · 📊 Quiz <b>${s.score === "" || s.score == null ? "–" : esc(s.score) + "/10"}</b> · ${ST_LABEL(s)}</p>
    <p>Tiết 1: ${s.s1 ? "✅ " + esc(s.s1Time) : "chưa xong"} · Tiết 2: ${s.completed ? "✅ " + esc(s.completedTime) : s.s2Started ? "đang học" : "chưa học"} · Truy cập cuối: ${esc(s.lastAccess)}</p>
    <h3>📝 Exit Ticket</h3>${t ? `<p><b>Điều quan trọng nhất:</b> ${esc(t.learned)}</p><p><b>Tự đánh giá:</b> ${esc(t.understanding)}/5</p><p><b>Còn thắc mắc:</b> ${esc(t.question) || "–"}</p><p><b>Ví dụ thực tế:</b> ${esc(t.realLife)}</p>` : '<p class="hint">Chưa nộp.</p>'}
    <h3>🌳 Mindmap của học sinh</h3>${mm ? '<svg class="mm" id="tmm" viewBox="0 0 1000 600"></svg>' : '<p class="hint">Chưa có Mindmap.</p>'}
    <h3>🧩 Các hoạt động & Quiz (${d.responses.length})</h3><div class="tw"><table><tr><th>Tiết</th><th>Hoạt động</th><th>Câu hỏi</th><th>Trả lời</th><th>Đúng lần đầu</th><th>Số lần thử</th><th>XP</th><th>Thời gian</th></tr>${d.responses.map(r => `<tr><td>${esc(r.session)}</td><td>${esc(r.activity)}</td><td>${esc(r.question)}</td><td>${esc(r.answer)}</td><td>${okc(r)}</td><td>${esc(r.attempts)}</td><td>${esc(r.xp)}</td><td>${esc(String(r.time || "").replace("T", " ").slice(0, 19))}</td></tr>`).join("")}</table></div></div>`;
    $("#mx").onclick = close; if (mm) mmRender($("#tmm"), mm);
}

/* ============================================================
   KHỞI ĐỘNG – luôn về màn hình chào, KHÔNG tự mở học sinh trước
   ============================================================ */
(function init() {
    $("#demoBar").hidden = !DEMO;
    try { sessionStorage.removeItem("activeStudentId"); sessionStorage.removeItem("activeLearningCode"); } catch (e) { }
    viewWelcome();
    flush();                                     // gửi nốt các thao tác còn chờ từ phiên trước (mỗi bản ghi tự mang StudentID riêng)
    window.addEventListener("online", () => flush());
    window.addEventListener("beforeunload", () => { if (S) saveCache(); });
})();
</script>
